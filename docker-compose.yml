services:
  infiniaibook:
    build: .
    image: infiniaibook:latest
    container_name: infiniaibook
    restart: unless-stopped
    # Bound to this machine only. Set INFINIAIBOOK_PASSWORD before exposing it
    # any further; see SECURITY.md.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      DATA_DIR: /data
    volumes:
      - infiniaibook-data:/data
    # Same probe as the image's HEALTHCHECK; see docs/getting-started.md.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Local model servers (Ollama, LM Studio, llama.cpp) on the host are
    # reachable as http://host.docker.internal:<port>/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  infiniaibook-data:
