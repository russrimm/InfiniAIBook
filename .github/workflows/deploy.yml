name: Deploy to Azure

# Runs after CI passes on main, or by hand. Builds the image in Azure Container
# Registry and points the existing Container App at it. Infrastructure changes
# still go through infra/main.bicep (see docs/azure-deployment.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  AZURE_REGISTRY: ${{ vars.AZURE_REGISTRY }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    # Only this job signs in to Azure, so only it may request an OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image in the registry
        id: image
        run: |
          tag="${DEPLOY_SHA:0:12}"
          az acr build --registry "$AZURE_REGISTRY" \
            --image "infiniaibook:$tag" \
            --build-arg WITH_PYTHON=true --no-logs .
          echo "ref=$AZURE_REGISTRY.azurecr.io/infiniaibook:$tag" >> "$GITHUB_OUTPUT"

      - name: Roll the Container App to the new image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$IMAGE_REF" \
            --revision-suffix "r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Check the new revision is healthy
        run: |
          for i in $(seq 1 30); do
            state=$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" \
              --revision "$AZURE_CONTAINER_APP--r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
              --query "properties.{h:healthState,p:provisioningState,r:runningState}" -o tsv)
            echo "attempt $i: $state"
            case "$state" in
              Healthy*Provisioned*Running*) exit 0 ;;
              *Failed*) echo "::error::Revision failed to start"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Revision did not become healthy in time"
          exit 1

      - name: Smoke test the deployed app
        run: |
          fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$fqdn" ]; then
            echo "::error::The Container App has no ingress FQDN"
            exit 1
          fi
          url="https://$fqdn/api/health"
          delay=5
          for i in $(seq 1 8); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$url" || true)
            echo "attempt $i: HTTP ${code:-none}"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Healthy: $url"
              exit 0
            fi
            sleep "$delay"
            delay=$((delay * 2 > 60 ? 60 : delay * 2))
          done
          echo "::error::$url did not report healthy"
          exit 1
