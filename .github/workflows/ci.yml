name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress for it. Pushes
# to main each get their own group and are never cancelled, so every merged
# commit is still fully checked (and deployable).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lockfile uses the public npm registry
        run: |
          if grep -nE '"resolved": "https?://' package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error file=package-lock.json::Every resolved URL must be on https://registry.npmjs.org/. Regenerate the lockfile against the public registry, or a mirror configured with replace-registry-host=npmjs."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: URL-fetch safety tests
        run: npm run check:ssrf
      - name: Dependency audit (production, high severity)
        # Reports high-severity findings as a warning annotation and does not
        # fail the job, so a newly published advisory cannot block every merge
        # while a fix is prepared. The production tree is clean today (the
        # image-size advisories behind pptxgenjs are fixed by the override in
        # package.json); switch the `exit 0` below to `exit 1` to make it a gate.
        run: |
          if npm audit --omit=dev --audit-level=high > audit.log 2>&1; then
            cat audit.log
          elif grep -qE 'Severity:|# npm audit report' audit.log; then
            cat audit.log
            echo "::warning::npm audit found high-severity vulnerabilities in production dependencies; see the step log."
            exit 0
          else
            cat audit.log
            echo "::warning::npm audit could not complete (registry or network error); skipping."
          fi
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: unit (node ${{ matrix.node }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  render-checks:
    # Composes a synthetic motion and training video with the Python renderer,
    # without Azure, model or Speech calls. The HyperFrames variants need Chrome
    # and a network fetch, so they stay manual (npm run check:motion -- --hyperframes).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install renderer packages
        run: python -m pip install numpy pillow imageio-ffmpeg
      - name: Motion renderer check
        run: npm run check:motion
        env:
          PYTHON_BIN: python
      - name: Training compositor check
        run: npm run check:training
        env:
          PYTHON_BIN: python
      - name: Training talking-head shape check
        run: npm run check:training -- --head
        env:
          PYTHON_BIN: python

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image with Python renderers
        run: docker build --build-arg WITH_PYTHON=true -t infiniaibook:ci .
      - name: Image boots and serves the app
        run: |
          docker run -d --name app -p 3000:3000 infiniaibook:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "App answered after ${i} attempt(s)."
              docker exec app python3 -c "import numpy, PIL, imageio_ffmpeg; print('renderer packages ok')"
              exit 0
            fi
            sleep 2
          done
          docker logs app
          echo "::error::The container did not serve http://127.0.0.1:3000/ within 60 seconds."
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
