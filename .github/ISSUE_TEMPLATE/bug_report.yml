name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't** include API keys, `.env.local` contents, cookies or private documents.
        Report security vulnerabilities privately as described in [SECURITY.md](https://github.com/russrimm/InfiniAIBook/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a notebook with a PDF source
        2. Generate an audio overview
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sources and ingestion
        - Chat
        - Notes and search
        - Studio (reports, infographics, mind maps, quizzes, ...)
        - Audio overviews
        - Videos (whiteboard, motion, training)
        - Setup, configuration or Docker
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model provider
      placeholder: e.g. Azure OpenAI gpt-5-mini, Ollama qwen3.5, Anthropic via AI_PROVIDER
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Node 22.13, npm run dev / Docker
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      description: Remove any secrets before pasting.
      render: text
