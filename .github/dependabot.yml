version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Keeps the digest-pinned node base image in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
