version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors held back on purpose; each needs something outside this repo first.
    ignore:
      # undici 8 requires Node >=22.19.0, but the app declares support for
      # Node >=22.13 (package.json engines, README, docs). Revisit when that
      # minimum is raised to 22.19 or later.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]
      # eslint-config-next (16.4.6 and the 16.5 canary) pulls in
      # eslint-plugin-react and eslint-plugin-jsx-a11y, whose latest releases
      # declare peer support only up to eslint 9, and eslint-plugin-import 2.32.0,
      # which does too. Revisit when an eslint-config-next release installs
      # cleanly against eslint 10 without overrides or --legacy-peer-deps.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types for the oldest Node the app supports (22), so code cannot use an
      # API that exists only in a newer runtime. Same revisit condition as undici.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # unpdf 2 requires Node >=24 (1.x needs >=22). Same revisit condition as undici.
      - dependency-name: unpdf
        update-types: ["version-update:semver-major"]
      # typescript-eslint (through eslint-config-next) refuses to run on TypeScript 7
      # ("typescript-eslint does not support TS 7.0"), which fails lint and type-check.
      # Revisit when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The renderer's Python packages (scripts/requirements-render.in compiled to
  # the hash-pinned scripts/requirements-render.txt). Dependabot rewrites both
  # files together.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      renderer-packages:
        patterns: ["*"]
    # numpy 2.5 requires Python >=3.12, but the Docker image installs Debian
    # bookworm's python3 (3.11), so the image build fails. Patch updates still
    # arrive. Revisit when the image moves to Python 3.12 or later.
    ignore:
      - dependency-name: numpy
        update-types: ["version-update:semver-minor"]
  # Keeps the digest-pinned node base image in the Dockerfile current. The app
  # targets the Node 22 LTS line, so major version jumps are not proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
